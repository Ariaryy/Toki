name: CI

# Both platforms on every push that touches the code: the daemon and GUI have a Windows and
# a Linux half behind `cfg`, and a change that compiles on one says nothing about the other.
#
# It runs only when something that gets compiled, linted or tested changes. Docs, mockups, assets
# and the release workflow can't break the build, so they don't pay for two runners.
on:
  push:
    branches: [master, main]
    paths: &build-inputs
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *build-inputs
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant. Runners are slow and
# metered, so don't pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the cache smaller and the build quieter; nothing here needs incremental rebuilds.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # What Tauri needs to link against WebKitGTK. The daemon's Linux dependencies are pure
      # Rust and need nothing here.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The frontend has to exist before any cargo command touches toki-gui: its build.rs
      # runs tauri-build, and `generate_context!` embeds `frontendDist` (ui/build) at compile
      # time. Without this step every cargo job below fails on a missing directory rather
      # than on anything real.
      - name: Install frontend dependencies
        working-directory: crates/toki-gui/ui
        run: bun install --frozen-lockfile

      - name: Type-check frontend
        working-directory: crates/toki-gui/ui
        run: bun run check

      - name: Build frontend
        working-directory: crates/toki-gui/ui
        run: bun run build

      # tauri-build refuses to compile toki-gui unless the `externalBin` sidecar exists, and
      # the real one is a release build of toki-daemon that only bundling needs. An empty
      # file satisfies the check without paying for that build.
      - name: Stub the daemon sidecar
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p crates/toki-gui/binaries
          touch "crates/toki-gui/binaries/toki-daemon-$triple$ext"

      - name: Formatting
        run: cargo fmt --all --check

      # `-D warnings` because the repo's standard is that clippy is silent, not that clippy
      # is mostly silent. --all-targets covers tests too, which is where lint rot starts.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
