[package]
name = "toki-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only Tauri GUI for Toki"

[lib]
# The `_lib` suffix keeps the lib name distinct from the `toki` binary — the two collide on
# Windows otherwise. See https://github.com/rust-lang/cargo/issues/8519
name = "toki_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "toki"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
toki-core = { path = "../toki-core" }
toki-store = { path = "../toki-store" }
chrono = { workspace = true, features = ["clock"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_System_Registry",  # AppsUseLightTheme, to follow the system light/dark setting
]
